<!DOCTYPE html>
<html>
<head>
    <title>HTML Hyperlinks</title>
</head>

<body>

    <h1>Working of Hyperlinks</h1>

    <h2>Hyperlink with href Attribute</h2>
    <a href="https://www.google.com">
        Visit Google
    </a>

    <h2>Hyperlink with target="_self"</h2>
    <a href="https://www.wikipedia.org" target="_self">
        Visit Wikipedia
    </a>

    <h2>Hyperlink with target="_blank"</h2>
    <a href="https://www.youtube.com" target="_blank">
        Visit YouTube
    </a>

</body>
</html>
