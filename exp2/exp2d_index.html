<!DOCTYPE html>
<html>
<head>
    <title>HTML Frames</title>
</head>

<frameset rows="33%,33%,34%">

    <frame src="exp2d_image.html" name="imageFrame">

    <frame src="exp2d_para.html" name="paragraphFrame">

    <frame src="exp2d_link.html" name="linkFrame">

    <noframes>
        <body>
            <h2>Frames are not supported</h2>
            <p>
                Your browser does not support frames.
                Please use a browser that supports HTML frames.
            </p>
        </body>
    </noframes>

</frameset>

</html>
