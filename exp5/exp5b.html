<!DOCTYPE html>
<html>
<head>
    <title>Background Image</title>

    <style>
        body {
            height: 1500px;
            margin: 0;

            /* Background image */
            background-image: url("image.jpg");

            /* Place image halfway down the page */
            background-position: center 50%;

            /* Do not repeat image */
            background-repeat: no-repeat;

            /* Image remains fixed when scrolling */
            background-attachment: fixed;

            /* Tilt the background image horizontally */
            transform: skewX(-10deg);
        }

        h1 {
            text-align: center;
            margin-top: 700px;
            transform: skewX(10deg);
        }
    </style>
</head>

<body>

    <h1>Background Image Example</h1>

</body>
</html>
