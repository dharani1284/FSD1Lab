<!DOCTYPE html>
<html>
<head>
    <title>Background Image</title>

    <style>
        body {
            height: 1500px;
            margin: 0;
        }

        /* Background image */
        body::before {
            content: "";
            position: fixed;

            width: 100%;
            height: 300px;

            top: 50%;
            left: 0;

            background-image: url("image.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            /* Tilt horizontally */
            transform: skewX(-10deg);

            /* Remains fixed while scrolling */
            z-index: -1;
        }

        h1 {
            text-align: center;
            padding-top: 700px;
        }
    </style>
</head>

<body>

    <h1>Background Image Example</h1>

</body>
</html>
