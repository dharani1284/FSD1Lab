<!DOCTYPE html>
<html>
<head>
    <title>Math Object</title>
</head>
<body>

    <h2>Math Object</h2>
    <p id="result"></p>

    <script>
        let number = 25.6;

        document.getElementById("result").innerHTML =
            "PI = " + Math.PI +
            "<br>Round = " + Math.round(number) +
            "<br>Ceil = " + Math.ceil(number) +
            "<br>Floor = " + Math.floor(number) +
            "<br>Square Root = " + Math.sqrt(25) +
            "<br>Power = " + Math.pow(5, 2) +
            "<br>Random Number = " + Math.random();
    </script>

</body>
</html>
