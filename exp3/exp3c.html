<!DOCTYPE html>
<html>
<head>
    <title>Types of CSS</title>

    <!-- Internal CSS -->
    <style>
        h2 {
            color: blue;
            text-align: center;
        }

        p {
            font-size: 18px;
        }
    </style>
</head>

<body>

    <!-- Inline CSS -->
    <h1 style="color: red; text-align: center;">
        Inline CSS Example
    </h1>

    <!-- Internal CSS -->
    <h2>Internal CSS Example</h2>

    <p>This paragraph is styled using Internal CSS.</p>

    <!-- External CSS representation -->
    <h3>External CSS Example</h3>

    <p>
        External CSS is normally written in a separate .css file
        and connected using the &lt;link&gt; tag.
    </p>

</body>
</html>
