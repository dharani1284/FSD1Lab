<!DOCTYPE html>
<html>
<head>
    <title>CSS Types Example</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        p {
            color: green;
            font-size: 18px;
        }

        .box {
            background-color: lightgray;
            padding: 20px;
        }
    </style>
</head>

<body>

    <!-- Inline CSS -->
    <h1 style="color: blue; text-align: center;">
        Welcome to My Website
    </h1>

    <div class="box">
        <p>This paragraph uses Internal CSS.</p>

        <h2>This heading uses External CSS.</h2>

        <!-- Inline CSS -->
        <button style="background-color: orange; color: white;">
            Click Me
        </button>
    </div>

</body>
</html>
