<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Output Methods</title>
</head>
<body>

    <h2>JavaScript Output Methods</h2>

    <p id="demo"></p>

    <script>
        // 1. document.write()
        document.write("This is document.write() output.<br>");

        // 2. innerHTML
        document.getElementById("demo").innerHTML =
            "This is innerHTML output.";

        // 3. alert()
        alert("This is alert() output.");

        // 4. console.log()
        console.log("This is console.log() output.");
    </script>

</body>
</html>
